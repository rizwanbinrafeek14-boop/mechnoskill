<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Mechnoskill Industrial Supplier</title>
<link rel="stylesheet" href="style.css">
<script src="db.js"></script>
<script src="components.js" defer></script>
<style>
.shop-layout{display:flex;gap:0;min-height:70vh}
.sidebar{width:230px;min-width:230px;background:#fff;border-right:1px solid #e8e8e8;padding:18px}
.filter-sec{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f0f0f0}
.filter-sec:last-child{border-bottom:none}
.filter-title{font-size:11px;font-weight:800;color:#1e1e1e;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.filter-title a{color:#F5C800;font-size:10px;cursor:pointer;font-weight:600;text-transform:none;letter-spacing:0;text-decoration:none}
.check-list{display:flex;flex-direction:column;gap:7px}
.check-item{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#555}
.check-item input{accent-color:#F5C800;width:14px;height:14px;cursor:pointer}
.check-item .cnt{font-size:10px;color:#bbb;margin-left:auto}
.range-wrap{padding:4px 0}
input[type=range]{width:100%;accent-color:#F5C800;margin:8px 0}
.range-vals{display:flex;gap:8px;margin-top:4px}
.range-vals input{width:100%;border:1px solid #e8e8e8;border-radius:4px;padding:5px 8px;font-size:11px;text-align:center;outline:none}
.range-vals input:focus{border-color:#F5C800}
.toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#555}
.star-row{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 0}
.star-row input[type=radio]{accent-color:#F5C800}
.star-gold{color:#F5C800;font-size:13px}
.star-cnt{font-size:10px;color:#bbb}
.apply-filter-btn{width:100%;background:#F5C800;color:#1e1e1e;border:none;border-radius:4px;padding:9px;font-size:12px;font-weight:800;cursor:pointer;margin-top:10px}
.apply-filter-btn:hover{background:#D4AA00}
.main-area{flex:1;padding:18px 20px}
.shop-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.results-info{font-size:13px;color:#666}
.results-info strong{color:#1e1e1e}
.sort-row{display:flex;align-items:center;gap:10px}
.sort-row label{font-size:12px;color:#888}
.sort-row select{border:1px solid #e8e8e8;border-radius:4px;padding:6px 10px;font-size:12px;outline:none;background:#fff;cursor:pointer}
.sort-row select:focus{border-color:#F5C800}
.active-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.atag{background:#FFFDE7;border:1px solid #F5C800;border-radius:20px;padding:3px 12px;font-size:11px;color:#F5C800;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
.atag:hover{background:#FFE082}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:28px;flex-wrap:wrap}
.pg-btn{width:34px;height:34px;border:1px solid #e8e8e8;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:#fff;font-weight:500;color:#555;transition:all .2s}
.pg-btn:hover{border-color:#F5C800;color:#F5C800}
.pg-btn.active{background:#F5C800;border-color:#F5C800;color:#1e1e1e;font-weight:800}
.no-results{text-align:center;padding:48px;color:#aaa;grid-column:1/-1}
.no-results svg{width:48px;height:48px;stroke:#ddd;fill:none;stroke-width:1.2;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}
@media(max-width:700px){.shop-layout{flex-direction:column}.sidebar{width:100%;min-width:0}}
</style>
</head>
<body>
<div id="header-root"></div>
<div class="breadcrumb"><a href="index.html">Home</a> › <span class="cur">Shop</span></div>

<div class="shop-layout">
  <div class="sidebar">
    <div class="filter-sec">
      <div class="filter-title">Search <a onclick="clearFilters()">Clear All</a></div>
      <input type="text" id="sideSearch" class="form-input" placeholder="Search products..." oninput="filterProducts()" style="font-size:12px;padding:7px 10px">
    </div>
    <div class="filter-sec">
      <div class="filter-title">Category</div>
      <div class="check-list">
        <div class="check-item"><input type="checkbox" value="bearings" class="cat-filter" onchange="filterProducts()"><label>Bearings</label><span class="cnt">1,240</span></div>
        <div class="check-item"><input type="checkbox" value="fasteners" class="cat-filter" onchange="filterProducts()"><label>Fasteners</label><span class="cnt">2,100</span></div>
        <div class="check-item"><input type="checkbox" value="hydraulics" class="cat-filter" onchange="filterProducts()"><label>Hydraulics</label><span class="cnt">890</span></div>
        <div class="check-item"><input type="checkbox" value="safety" class="cat-filter" onchange="filterProducts()"><label>Safety Equipment</label><span class="cnt">1,500</span></div>
        <div class="check-item"><input type="checkbox" value="tools" class="cat-filter" onchange="filterProducts()"><label>Tools & Machinery</label><span class="cnt">3,200</span></div>
        <div class="check-item"><input type="checkbox" value="electrical" class="cat-filter" onchange="filterProducts()"><label>Electrical</label><span class="cnt">980</span></div>
        <div class="check-item"><input type="checkbox" value="pipes" class="cat-filter" onchange="filterProducts()"><label>Pipes & Fittings</label><span class="cnt">760</span></div>
      </div>
    </div>
    <div class="filter-sec">
      <div class="filter-title">Brand</div>
      <div class="check-list">
        <div class="check-item"><input type="checkbox" value="SKF" class="brand-filter" onchange="filterProducts()"><label>SKF</label><span class="cnt">320</span></div>
        <div class="check-item"><input type="checkbox" value="BOSCH" class="brand-filter" onchange="filterProducts()"><label>BOSCH</label><span class="cnt">210</span></div>
        <div class="check-item"><input type="checkbox" value="HONEYWELL" class="brand-filter" onchange="filterProducts()"><label>HONEYWELL</label><span class="cnt">190</span></div>
        <div class="check-item"><input type="checkbox" value="STANLEY" class="brand-filter" onchange="filterProducts()"><label>STANLEY</label><span class="cnt">160</span></div>
        <div class="check-item"><input type="checkbox" value="MAKITA" class="brand-filter" onchange="filterProducts()"><label>MAKITA</label><span class="cnt">140</span></div>
        <div class="check-item"><input type="checkbox" value="FAG" class="brand-filter" onchange="filterProducts()"><label>FAG</label><span class="cnt">210</span></div>
        <div class="check-item"><input type="checkbox" value="MSA" class="brand-filter" onchange="filterProducts()"><label>MSA</label><span class="cnt">120</span></div>
        <div class="check-item"><input type="checkbox" value="FLUKE" class="brand-filter" onchange="filterProducts()"><label>FLUKE</label><span class="cnt">90</span></div>
      </div>
    </div>
    <div class="filter-sec">
      <div class="filter-title">Price Range (SAR)</div>
      <div class="range-wrap">
        <input type="range" id="maxPrice" min="0" max="2000" value="2000" oninput="document.getElementById('maxPriceVal').value='SAR '+this.value;filterProducts()">
        <div class="range-vals">
          <input type="text" value="SAR 0" readonly>
          <input type="text" id="maxPriceVal" value="SAR 2000" readonly>
        </div>
      </div>
    </div>
    <div class="filter-sec">
      <div class="filter-title">Availability</div>
      <div class="toggle-row"><span>In Stock Only</span><div class="toggle on" id="stockToggle" onclick="this.classList.toggle('on');filterProducts()"></div></div>
    </div>
    <div class="filter-sec">
      <div class="filter-title">Min. Rating</div>
      <div class="star-row"><input type="radio" name="rt" value="5" onchange="filterProducts()"><span class="star-gold">★★★★★</span><span class="star-cnt">(142)</span></div>
      <div class="star-row"><input type="radio" name="rt" value="4" onchange="filterProducts()" checked><span class="star-gold">★★★★</span><span class="star-cnt">(89)</span></div>
      <div class="star-row"><input type="radio" name="rt" value="3" onchange="filterProducts()"><span class="star-gold">★★★</span><span class="star-cnt">(34)</span></div>
      <div class="star-row"><input type="radio" name="rt" value="0" onchange="filterProducts()"><span style="color:#ccc">Any Rating</span></div>
    </div>
    <button class="apply-filter-btn" onclick="filterProducts()">Apply Filters</button>
  </div>

  <div class="main-area">
    <div class="shop-top">
      <div class="results-info">Showing <strong id="resCount">8</strong> products</div>
      <div class="sort-row">
        <label>Sort by:</label>
        <select id="sortBy" onchange="filterProducts()">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name A–Z</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>
    <div class="active-tags" id="activeTags"></div>
    <div class="shop-grid" id="shopGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
const allProducts = MDB.getProducts();

let PAGE=1, PER=8;

function starHTML(r){return '<span style="color:#F5C800">'+('★'.repeat(r))+'</span><span style="color:#ddd">'+('★'.repeat(5-r))+'</span>';}
function prodCard(p){ return MDB.productCardHTML(p); } function _prodCard_old(p){
  const bc=p.badge==='NEW'?'new-badge':p.badge==='SALE'?'sale-badge':'';
  return `<div class="prod-card">
    <div class="prod-img">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
      ${p.badge?`<div class="prod-badge ${bc}">${p.badge}</div>`:''}
      <div class="prod-wish" onclick="toggleWishlist('${p.id}','${p.name}')"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    </div>
    <div class="prod-info">
      <div class="prod-brand">${p.brand}</div>
      <div class="prod-name">${p.name}</div>
      <div class="prod-sku">SKU: ${p.sku}</div>
      <div>${starHTML(p.rating)}<span class="prod-reviews"> (${p.reviews})</span></div>
      <div class="prod-bottom">
        <div class="prod-price">SAR ${p.price.toFixed(2)}<small>Incl. VAT</small></div>
        <button class="add-btn" onclick="addToCart('${p.id}','${p.name}','${p.brand}',${p.price},'${p.sku}')">+ Add</button>
      </div>
      <div style="text-align:center;margin-top:5px"><a href="contact.html" style="font-size:10px;color:#F5C800;font-weight:700">Request Quote</a></div>
    </div>
  </div>`;
}

function filterProducts(){
  let prods=[...allProducts];
  const q=document.getElementById('sideSearch').value.toLowerCase();
  const cats=[...document.querySelectorAll('.cat-filter:checked')].map(e=>e.value);
  const brands=[...document.querySelectorAll('.brand-filter:checked')].map(e=>e.value);
  const maxP=parseInt(document.getElementById('maxPrice').value);
  const minRt=parseInt(document.querySelector('input[name="rt"]:checked')?.value||0);
  const sort=document.getElementById('sortBy').value;

  if(q) prods=prods.filter(p=>p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q));
  if(cats.length) prods=prods.filter(p=>cats.includes(p.cat));
  if(brands.length) prods=prods.filter(p=>brands.includes(p.brand));
  prods=prods.filter(p=>p.price<=maxP);
  if(minRt>0) prods=prods.filter(p=>p.rating>=minRt);

  if(sort==='price-asc') prods.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc') prods.sort((a,b)=>b.price-a.price);
  else if(sort==='name') prods.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='rating') prods.sort((a,b)=>b.rating-a.rating);

  document.getElementById('resCount').textContent=prods.length;
  const start=(PAGE-1)*PER, slice=prods.slice(start,start+PER);
  document.getElementById('shopGrid').innerHTML = slice.length
    ? slice.map(prodCard).join('')
    : '<div class="no-results"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>No products found.<br>Try different filters.</p></div>';

  // Pagination
  const pages=Math.ceil(prods.length/PER);
  document.getElementById('pagination').innerHTML=pages>1
    ? Array.from({length:pages},(_, i)=>`<div class="pg-btn ${i+1===PAGE?'active':''}" onclick="PAGE=${i+1};filterProducts()">${i+1}</div>`).join('')
    : '';

  // Active tags
  const tags=[];
  cats.forEach(c=>tags.push(`${c} <span onclick="uncheckCat('${c}')">✕</span>`));
  brands.forEach(b=>tags.push(`${b} <span onclick="uncheckBrand('${b}')">✕</span>`));
  document.getElementById('activeTags').innerHTML=tags.map(t=>`<div class="atag">${t}</div>`).join('');
}

function uncheckCat(v){document.querySelector(`.cat-filter[value="${v}"]`).checked=false;filterProducts();}
function uncheckBrand(v){document.querySelector(`.brand-filter[value="${v}"]`).checked=false;filterProducts();}
function clearFilters(){
  document.querySelectorAll('.cat-filter,.brand-filter').forEach(e=>e.checked=false);
  document.getElementById('sideSearch').value='';
  document.getElementById('maxPrice').value=2000;
  document.getElementById('maxPriceVal').value='SAR 2000';
  filterProducts();
}

// Read URL params on load
window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const cat=params.get('cat');
  if(cat){const cb=document.querySelector(`.cat-filter[value="${cat}"]`);if(cb)cb.checked=true;}
  const q=params.get('q');
  if(q) document.getElementById('sideSearch').value=q;
  filterProducts();
});
</script>
<div id="footer-root"></div>
<script>
document.getElementById('header-root').innerHTML=renderHeader('shop.html');
document.getElementById('footer-root').innerHTML=renderFooter();
</script>
</body></html>
