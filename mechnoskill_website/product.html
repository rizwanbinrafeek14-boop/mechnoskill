<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Mechnoskill</title>
<link rel="stylesheet" href="style.css">
<script src="db.js"></script>
<script src="components.js" defer></script>
<style>
.prod-layout{display:flex;gap:32px;padding:28px 32px;flex-wrap:wrap}
.prod-images{width:360px;min-width:280px}
.main-img{background:linear-gradient(135deg,#f5f5f3,#ebebea);border:1px solid #e8e8e8;border-radius:8px;height:300px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;overflow:hidden}
.main-img img{max-height:260px;max-width:260px;object-fit:contain}
.main-img svg{width:110px;height:110px;stroke:#c0c0c0;fill:none;stroke-width:1}
.img-badge{position:absolute;top:12px;left:12px;background:#F5C800;color:#1e1e1e;font-size:10px;font-weight:800;padding:4px 10px;border-radius:2px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:68px;height:68px;background:#fff;border:1.5px solid #e8e8e8;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .2s}
.thumb.active{border-color:#F5C800}
.thumb img{max-width:58px;max-height:58px;object-fit:contain}
.thumb svg{width:30px;height:30px;stroke:#ccc;fill:none;stroke-width:1.2}
.prod-info-panel{flex:1;min-width:260px}
.prod-brand-badge{background:#2b2b2b;color:#F5C800;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;padding:4px 12px;border-radius:3px;display:inline-block;margin-bottom:12px;letter-spacing:1px}
.prod-title{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:800;color:#1e1e1e;line-height:1.2;margin-bottom:10px}
.prod-meta-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.sku-label{font-size:12px;color:#999}
.sku-label span{color:#444;font-weight:600}
.stock-ok{background:#E8F5E9;color:#2E7D32;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.stock-no{background:#FFEBEE;color:#C62828;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.price-block{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:16px;margin-bottom:16px}
.price-main{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:800;color:#F5C800}
.price-vat{font-size:11px;color:#999;margin-top:4px}
.bulk-box{background:#FFFDE7;border:1px solid #F5C800;border-radius:6px;padding:10px 14px;margin-top:12px}
.bulk-title{font-size:11px;font-weight:800;color:#1e1e1e;margin-bottom:6px}
.bulk-tiers{display:flex;gap:8px;flex-wrap:wrap}
.bulk-tier{background:#fff;border:1px solid #F5C800;border-radius:4px;padding:5px 12px;text-align:center;font-size:11px}
.bulk-tier strong{display:block;font-size:14px;font-weight:800;color:#F5C800}
.qty-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qty-label{font-size:13px;font-weight:600;color:#555;width:70px}
.qty-ctrl{display:flex;align-items:center;border:1px solid #e8e8e8;border-radius:4px;overflow:hidden}
.qty-ctrl button{width:36px;height:36px;background:#f5f5f3;border:none;font-size:18px;cursor:pointer;font-weight:700}
.qty-ctrl button:hover{background:#FFFDE7;color:#F5C800}
.qty-ctrl input{width:50px;height:36px;border:none;border-left:1px solid #eee;border-right:1px solid #eee;text-align:center;font-size:14px;font-weight:700;outline:none;font-family:"Barlow",sans-serif}
.action-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn-cart-main{flex:1;background:#F5C800;color:#1e1e1e;border:none;border-radius:4px;padding:13px 20px;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:.5px;min-width:140px;font-family:"Barlow",sans-serif}
.btn-cart-main:hover{background:#D4AA00}
.btn-wish-main{background:#fff;color:#1e1e1e;border:1.5px solid #e8e8e8;border-radius:4px;padding:13px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:"Barlow",sans-serif}
.btn-wish-main:hover{border-color:#F5C800;color:#F5C800}
.btn-quote-main{width:100%;background:#2b2b2b;color:#fff;border:none;border-radius:4px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:14px;letter-spacing:.5px;font-family:"Barlow",sans-serif}
.btn-quote-main:hover{background:#1e1e1e}
.delivery-box{background:#f9f9f8;border-radius:6px;padding:12px 14px;font-size:12px;color:#555;display:flex;flex-direction:column;gap:7px}
.delivery-row{display:flex;align-items:center;gap:8px}
.delivery-row svg{width:14px;height:14px;stroke:#F5C800;fill:none;stroke-width:1.8;flex-shrink:0}
/* TABS */
.tabs-bar{display:flex;border-bottom:2px solid #eee;padding:0 32px;background:#fff}
.tab-btn{padding:14px 20px;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:"Barlow",sans-serif}
.tab-btn.active{color:#F5C800;border-bottom-color:#F5C800}
.tab-pane{display:none;padding:28px 32px}
.tab-pane.active{display:block}
.spec-table{width:100%;border-collapse:collapse;max-width:600px}
.spec-table tr:nth-child(even){background:#f9f9f8}
.spec-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f0f0f0}
.spec-table td:first-child{font-weight:600;color:#1e1e1e;width:200px}
.review-card{background:#f9f9f8;border-radius:8px;padding:14px;margin-bottom:12px}
.review-meta{display:flex;justify-content:space-between;margin-bottom:6px}
.review-author{font-size:13px;font-weight:700;color:#1e1e1e}
.review-date{font-size:11px;color:#bbb}
.review-text{font-size:13px;color:#666;line-height:1.6}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
</style>
</head>
<body>
<div id="header-root"></div>
<div class="breadcrumb"><a href="index.html">Home</a> › <a href="shop.html">Shop</a> › <span class="cur" id="bcProd">Product</span></div>

<div id="prodContent">
  <div style="padding:64px;text-align:center;color:#aaa">Loading product...</div>
</div>

<div class="tabs-bar" id="tabsBar" style="display:none">
  <button class="tab-btn active" onclick="switchTab(0,this)">Description</button>
  <button class="tab-btn" onclick="switchTab(1,this)">Specifications</button>
  <button class="tab-btn" onclick="switchTab(2,this)">Reviews</button>
</div>
<div id="tab0" class="tab-pane active" style="display:none"></div>
<div id="tab1" class="tab-pane" style="display:none"></div>
<div id="tab2" class="tab-pane" style="display:none"></div>

<div id="relatedSection" style="display:none;padding:28px 32px;background:#f4f4f2">
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:#1e1e1e;margin-bottom:18px">Related <span style="color:#F5C800">Products</span></div>
  <div class="related-grid" id="relatedGrid"></div>
</div>

<div id="footer-root"></div>
<script>
document.getElementById('header-root').innerHTML = renderHeader('shop.html');
document.getElementById('footer-root').innerHTML = renderFooter();

function switchTab(idx,el){
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab'+idx).classList.add('active');
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const products = MDB.getProducts();
  const p = id ? MDB.getProduct(id) : products[0];

  if (!p) {
    document.getElementById('prodContent').innerHTML = '<div style="padding:64px;text-align:center"><h2>Product not found</h2><a href="shop.html" class="btn-y" style="display:inline-block;margin-top:16px">Back to Shop</a></div>';
    return;
  }

  document.title = p.name + ' | Mechnoskill';
  document.getElementById('bcProd').textContent = p.name.substring(0,40);

  const imgHTML = p.image
    ? `<img src="${p.image}" alt="${p.name}">`
    : `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>`;

  document.getElementById('prodContent').innerHTML = `
  <div class="prod-layout">
    <div class="prod-images">
      <div class="main-img" id="mainImg">
        ${imgHTML}
        ${p.badge ? `<div class="img-badge">${p.badge}</div>` : ''}
      </div>
      <div class="thumbs">
        <div class="thumb active">${imgHTML}</div>
        <div class="thumb"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9"/></svg></div>
        <div class="thumb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/></svg></div>
      </div>
    </div>
    <div class="prod-info-panel">
      <div class="prod-brand-badge">${p.brand}</div>
      <div class="prod-title">${p.name}</div>
      <div class="prod-meta-row">
        <div class="sku-label">SKU: <span>${p.sku}</span></div>
        <div>${MDB.stars(p.rating)} <span style="font-size:12px;color:#F5C800">(${p.reviews} reviews)</span></div>
        <div class="${(p.stock||0)>0?'stock-ok':'stock-no'}">${(p.stock||0)>0?'✓ In Stock — Ships 1–2 days':'Out of Stock'}</div>
      </div>
      <div class="price-block">
        <div class="price-main">SAR ${p.price.toFixed(2)}</div>
        <div class="price-vat">Inclusive of 15% VAT</div>
        <div class="bulk-box">
          <div class="bulk-title">💰 Bulk Pricing Available</div>
          <div class="bulk-tiers">
            <div class="bulk-tier">10–49 pcs<strong>SAR ${(p.price*0.92).toFixed(0)}</strong></div>
            <div class="bulk-tier">50–99 pcs<strong>SAR ${(p.price*0.85).toFixed(0)}</strong></div>
            <div class="bulk-tier">100+ pcs<strong>SAR ${(p.price*0.78).toFixed(0)}</strong></div>
          </div>
        </div>
      </div>
      <div class="qty-row">
        <div class="qty-label">Quantity</div>
        <div class="qty-ctrl">
          <button onclick="let v=parseInt(document.getElementById('qtyInput').value);if(v>1)document.getElementById('qtyInput').value=v-1">−</button>
          <input type="number" id="qtyInput" value="1" min="1">
          <button onclick="let v=parseInt(document.getElementById('qtyInput').value);document.getElementById('qtyInput').value=v+1">+</button>
        </div>
      </div>
      <div class="action-row">
        <button class="btn-cart-main" onclick="MDB.addToCart('${p.id}','${p.name}','${p.brand}',${p.price},'${p.sku}','${p.image||''}');window.location='cart.html'">🛒 Add to Cart</button>
        <button class="btn-wish-main" onclick="MDB.toggleWishlist('${p.id}','${p.name}');this.textContent=MDB.isWishlisted('${p.id}')?'♥ Wishlisted':'♡ Wishlist'">♡ Wishlist</button>
      </div>
      <button class="btn-quote-main" onclick="window.location='contact.html'">📋 Request a Bulk Quote</button>
      <div class="delivery-box">
        <div class="delivery-row"><svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Free delivery on orders over SAR 500</div>
        <div class="delivery-row"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Genuine certified product</div>
        <div class="delivery-row"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07"/></svg>Expert support: +966 9200 00000</div>
      </div>
    </div>
  </div>`;

  // TABS
  document.getElementById('tabsBar').style.display = 'flex';
  document.getElementById('tab0').style.display = 'block';
  document.getElementById('tab1').style.display = 'block';
  document.getElementById('tab2').style.display = 'block';

  document.getElementById('tab0').innerHTML = `<div class="tab-pane active"><p style="font-size:14px;line-height:1.8;color:#555;max-width:700px">${p.desc || p.name + ' — a high-quality industrial product from ' + p.brand + '. Suitable for demanding industrial applications across oil & gas, manufacturing, construction and more.'}</p></div>`;

  document.getElementById('tab1').innerHTML = `<div class="tab-pane"><table class="spec-table">
    <tr><td>Product Name</td><td>${p.name}</td></tr>
    <tr><td>Brand</td><td>${p.brand}</td></tr>
    <tr><td>SKU / Part No.</td><td>${p.sku}</td></tr>
    <tr><td>Category</td><td style="text-transform:capitalize">${p.cat}</td></tr>
    <tr><td>Price (incl. VAT)</td><td>SAR ${p.price.toFixed(2)}</td></tr>
    <tr><td>Stock Availability</td><td>${(p.stock||0)>0?'In Stock ('+p.stock+' units)':'Out of Stock'}</td></tr>
    <tr><td>Rating</td><td>${MDB.stars(p.rating)} (${p.reviews} reviews)</td></tr>
    <tr><td>Delivery</td><td>2–3 business days (KSA)</td></tr>
  </table></div>`;

  document.getElementById('tab2').innerHTML = `<div class="tab-pane">
    <div class="review-card"><div class="review-meta"><span class="review-author">Ahmed Al-Rashidi</span><span class="review-date">March 2026</span></div><div style="color:#F5C800;margin-bottom:6px">★★★★★</div><div class="review-text">Excellent quality. Arrived quickly and exactly as described. Will order again for our plant.</div></div>
    <div class="review-card"><div class="review-meta"><span class="review-author">Khalid Mohammed</span><span class="review-date">Feb 2026</span></div><div style="color:#F5C800;margin-bottom:6px">★★★★☆</div><div class="review-text">Good product, genuine brand. Fast delivery to Riyadh.</div></div>
  </div>`;

  // RELATED
  const related = products.filter(x => x.cat === p.cat && x.id !== p.id).slice(0,4);
  if (related.length) {
    document.getElementById('relatedSection').style.display = 'block';
    document.getElementById('relatedGrid').innerHTML = related.map(r => MDB.productCardHTML(r)).join('');
  }
});
</script>
</body></html>
